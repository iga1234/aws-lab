AWSTemplateFormatVersion: "2010-09-09"
Description: "AWS lab - security group"

Resources:
  LabSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP from anywhere
      SecurityGroupIngress:
        - IPProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: lab-sg
Outputs:
  SecurityGroupId:
    Value: !GetAtt LabSecurityGroup.GroupId
        